<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><meta name="description" content="suleimanzlatyn — share, connect and create.">
<title>suleimanzlatyn</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f5;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}#app{min-height:100vh}.shell{max-width:980px;margin:auto;padding-bottom:76px}.top{height:62px;border-bottom:1px solid #252525;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:#000e;backdrop-filter:blur(14px);z-index:20}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.top button{background:none;border:0;font-size:23px}.page{max-width:650px;margin:auto;padding:18px}.stories{display:flex;gap:16px;overflow:auto;padding:4px 0 18px}.story{min-width:68px;text-align:center;font-size:11px}.ring{width:64px;height:64px;padding:2px;border-radius:50%;background:linear-gradient(45deg,#ffd600,#ff0069,#7638fa);margin:auto auto 5px}.ring>div{width:100%;height:100%;border-radius:50%;border:2px solid #000;background:#222;overflow:hidden}.ring img{width:100%;height:100%;object-fit:cover}.card{border-bottom:1px solid #252525;padding:0 0 20px;margin-bottom:18px}.head{display:flex;align-items:center;gap:10px;padding:8px 0}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#333}.grow{flex:1}.muted{color:#999}.postmedia{width:100%;max-height:720px;object-fit:cover;border-radius:4px;background:#111}.actions{display:flex;gap:2px;padding:7px 0}.actions button{background:none;border:0;font-size:25px;padding:5px}.save{margin-left:auto}.liked{color:#ff3040!important}.caption{line-height:1.45}.bottom{position:fixed;bottom:0;left:0;right:0;height:66px;background:#050505f2;border-top:1px solid #292929;display:flex;justify-content:center;z-index:30}.bottom button{flex:1;max-width:125px;background:none;border:0;font-size:23px}.bottom small{display:block;font-size:10px;margin-top:2px}.fab{position:fixed;right:22px;bottom:84px;border:0;border-radius:50%;width:54px;height:54px;background:#fff;color:#000;font-size:30px;z-index:25}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}.sheet{width:min(650px,100%);background:#161616;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.close{float:right;background:none;border:0;font-size:25px}.field{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin:6px 0}.primary{width:100%;border:0;border-radius:10px;background:#fff;color:#000;padding:12px;font-weight:700;margin-top:8px}.tabs{display:flex;border-bottom:1px solid #292929;margin-bottom:15px}.tabs button{flex:1;padding:12px;background:none;border:0;border-bottom:2px solid transparent}.tabs .active{border-color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;background:#111}.profile{text-align:center}.profile img{width:92px;height:92px;border-radius:50%;object-fit:cover}.stats{display:flex;justify-content:center;gap:35px;margin:20px 0}.stats b{display:block}.pill{border:1px solid #444;background:#151515;border-radius:8px;padding:8px 18px}.row{display:flex;gap:10px;align-items:center}.search{font-size:18px}.listitem{padding:12px 0;border-bottom:1px solid #252525}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;display:none;z-index:100}.toast.on{display:block}@media(min-width:800px){.bottom{left:50%;transform:translateX(-50%);width:650px;border-radius:18px 18px 0 0}.page{padding-top:25px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='suleimanzlatyn_v2';
const imgs=['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300','https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300','https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300'];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 user:{name:'suleimanzlatyn',bio:'Creator · Kenya',avatar:imgs[0],followers:1200,following:180},
 posts:[
 {id:1,u:'suleimanzlatyn',avatar:imgs[0],media:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1000',type:'image',caption:'Welcome to suleimanzlatyn. Create. Share. Connect.',likes:128,comments:[{u:'amina',t:'Welcome!'}],saved:false},
 {id:2,u:'creatorhub',avatar:imgs[1],media:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1000',type:'image',caption:'Build something worth sharing.',likes:94,comments:[],saved:false}
 ],
 following:['creatorhub'],liked:[],notifications:[{t:'Welcome to suleimanzlatyn',time:'now'}],messages:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)}
function openSheet(html){sheet.innerHTML=html;modal.classList.add('on')}
function closeSheet(){modal.classList.remove('on')}
function nav(){return '<div class="bottom"><button onclick="home()">⌂<small>Home</small></button><button onclick="explore()">⌕<small>Search</small></button><button onclick="create()">＋<small>Create</small></button><button onclick="activity()">♡<small>Activity</small></button><button onclick="profile()">◎<small>Profile</small></button></div>'}
function shell(content,title='suleimanzlatyn'){app.innerHTML='<div class="shell"><header class="top"><button onclick="home()">⌁</button><div class="brand">'+title+'</div><button onclick="messages()">⌁</button></header><main class="page">'+content+'</main>'+nav()+'<button class="fab" onclick="create()">＋</button></div>'}
function stories(){return '<div class="stories">'+[['Your story',state.user.avatar],['amina',imgs[1]],['mohamed',imgs[2]],['sara',imgs[3]],['creatorhub',imgs[0]]].map((s,i)=>'<div class="story" onclick="story('+i+')"><div class="ring"><div><img src="'+s[1]+'"></div></div>'+esc(s[0])+'</div>').join('')+'</div>'}
function home(){shell(stories()+state.posts.map(postHTML).join(''))}
function postHTML(p){
 const liked=state.liked.includes(p.id),saved=p.saved;
 return '<article class="card"><div class="head"><img class="avatar" src="'+p.avatar+'"><div class="grow"><b>'+esc(p.u)+'</b><div class="muted">Kenya · now</div></div><button onclick="postMenu('+p.id+')" style="background:none;border:0">•••</button></div>'+
 (p.type==='video'?'<video class="postmedia" src="'+p.media+'" controls playsinline></video>':'<img class="postmedia" src="'+p.media+'" loading="lazy">')+
 '<div class="actions"><button class="'+(liked?'liked':'')+'" onclick="like('+p.id+')">'+(liked?'♥':'♡')+'</button><button onclick="comments('+p.id+')">◯</button><button onclick="share('+p.id+')">⌁</button><button class="save" onclick="toggleSave('+p.id+')">'+(saved?'▣':'□')+'</button></div>'+
 '<b>'+p.likes+' likes</b><div class="caption"><b>'+esc(p.u)+'</b> '+esc(p.caption)+'</div>'+
 (p.comments.length?'<div class="muted" onclick="comments('+p.id+')">View all '+p.comments.length+' comments</div>':'')+'</article>';
}
function like(id){let p=state.posts.find(x=>x.id===id);if(!p)return;const n=state.liked.indexOf(id);if(n>=0){state.liked.splice(n,1);p.likes=Math.max(0,p.likes-1)}else{state.liked.push(id);p.likes++;state.notifications.unshift({t:'You liked a post',time:'now'})}save();home()}
function toggleSave(id){let p=state.posts.find(x=>x.id===id);p.saved=!p.saved;save();toast(p.saved?'Saved':'Removed from saved');home()}
function comments(id){const p=state.posts.find(x=>x.id===id);openSheet('<button class="close" onclick="closeSheet()">×</button><h2>Comments</h2><div id="commentList">'+(p.comments.map(c=>'<div class="listitem"><b>'+esc(c.u)+'</b> '+esc(c.t)+'</div>').join('')||'<p class="muted">No comments yet.</p>')+'</div><div class="row"><input class="field" id="commentText" placeholder="Add a comment..."><button class="primary" style="width:auto" onclick="addComment('+id+')">Post</button></div>')}
function addComment(id){const v=commentText.value.trim();if(!v)return;state.posts.find(x=>x.id===id).comments.push({u:state.user.name,t:v});save();comments(id)}
function share(id){const p=state.posts.find(x=>x.id===id);const text='Check this post on suleimanzlatyn: '+p.caption;if(navigator.share)navigator.share({title:'suleimanzlatyn',text}).catch(()=>{});else navigator.clipboard?.writeText(text);toast('Share link copied')}
function postMenu(id){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>Post</h2><button class="field" onclick="toggleSave('+id+');closeSheet()">Save post</button><button class="field" onclick="toast(\'Report submitted\');closeSheet()">Report</button>')}
function story(i){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>Story</h2><img style="width:100%;max-height:65vh;object-fit:cover;border-radius:12px" src="'+(imgs[i%imgs.length])+'"><p>Stories are ready in this private build.</p>')}
function create(){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>Create</h2><div class="tabs"><button class="active">Post</button><button onclick="createStory()">Story</button><button onclick="createReel()">Reel</button></div><input class="field" id="mediaUrl" placeholder="Image/video URL (optional)"><input class="field" id="file" type="file" accept="image/*,video/*"><textarea class="field" id="caption" rows="4" placeholder="Write a caption..."></textarea><button class="primary" onclick="publish()">Publish</button>')}
function publish(){const file=document.getElementById('file').files[0],url=mediaUrl.value.trim();if(file){const r=new FileReader();r.onload=()=>finishPost(r.result,file.type.startsWith('video/')?'video':'image');r.readAsDataURL(file)}else finishPost(url||imgs[0],'image')}
function finishPost(media,type){state.posts.unshift({id:Date.now(),u:state.user.name,avatar:state.user.avatar,media,type,caption:caption.value.trim()||'New post.',likes:0,comments:[],saved:false});state.notifications.unshift({t:'Your post was published',time:'now'});save();closeSheet();home();toast('Published')}
function createStory(){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>New story</h2><input class="field" id="storyFile" type="file" accept="image/*"><input class="field" id="storyText" placeholder="Story text"><button class="primary" onclick="toast(\'Story added for this session\');closeSheet()">Add story</button>')}
function createReel(){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>New Reel</h2><input class="field" id="reelFile" type="file" accept="video/*"><textarea class="field" placeholder="Describe your Reel"></textarea><button class="primary" onclick="toast(\'Reel draft created\');closeSheet()">Create Reel</button>')}
function explore(){shell('<div class="row"><input class="field search" id="q" placeholder="Search people, captions, hashtags..." oninput="doSearch()"></div><div id="results" class="grid">'+state.posts.map(p=>'<img src="'+p.media+'" onclick="openPost('+p.id+')">').join('')+'</div>','Explore')}
function doSearch(){const q=q.value.toLowerCase();const a=state.posts.filter(p=>(p.u+' '+p.caption).toLowerCase().includes(q));results.innerHTML=a.map(p=>'<img src="'+p.media+'" onclick="openPost('+p.id+')">').join('')||'<p class="muted">No results.</p>'}
function openPost(id){const p=state.posts.find(x=>x.id===id);shell(postHTML(p),'Post')}
function profile(){const mine=state.posts.filter(p=>p.u===state.user.name);shell('<section class="profile"><img src="'+state.user.avatar+'"><h2>'+esc(state.user.name)+'</h2><p class="muted">'+esc(state.user.bio)+'</p><div class="stats"><div><b>'+mine.length+'</b>Posts</div><div><b>'+state.user.followers+'</b>Followers</div><div><b>'+state.user.following+'</b>Following</div></div><div class="row" style="justify-content:center"><button class="pill" onclick="editProfile()">Edit profile</button><button class="pill" onclick="settings()">⚙</button></div></section><div class="tabs"><button class="active">▦</button><button onclick="saved()">▣</button></div><div class="grid">'+mine.map(p=>'<img src="'+p.media+'">').join('')+'</div>')}
function editProfile(){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>Edit profile</h2><input class="field" id="name" value="'+esc(state.user.name)+'"><input class="field" id="bio" value="'+esc(state.user.bio)+'"><button class="primary" onclick="state.user.name=name.value.trim()||state.user.name;state.user.bio=bio.value;save();closeSheet();profile()">Save changes</button>')}
function saved(){const a=state.posts.filter(p=>p.saved);shell('<h2>Saved</h2><div class="grid">'+a.map(p=>'<img src="'+p.media+'">').join('')+'</div>')}
function activity(){shell('<h2>Activity</h2>'+(state.notifications.map(n=>'<div class="listitem">♡ '+esc(n.t)+' <span class="muted">'+esc(n.time)+'</span></div>').join('')||'<p class="muted">Nothing yet.</p>'),'Activity')}
function messages(){shell('<h2>Messages</h2><div class="listitem" onclick="chat(\'creatorhub\')"><b>creatorhub</b><div class="muted">Tap to open conversation</div></div><div class="listitem" onclick="chat(\'amina\')"><b>amina</b><div class="muted">Start a new conversation</div></div>','Messages')}
function chat(user){const arr=state.messages.filter(m=>m.with===user);openSheet('<button class="close" onclick="closeSheet()">×</button><h2>'+user+'</h2><div style="max-height:45vh;overflow:auto">'+(arr.map(m=>'<div class="listitem"><b>'+m.from+':</b> '+esc(m.text)+'</div>').join('')||'<p class="muted">No messages yet.</p>')+'</div><div class="row"><input class="field" id="msg" placeholder="Message..."><button class="primary" style="width:auto" onclick="sendMsg(\''+user+'\')">Send</button></div>')}
function sendMsg(user){const v=msg.value.trim();if(!v)return;state.messages.push({with:user,from:state.user.name,text:v});save();chat(user)}
function settings(){openSheet('<button class="close" onclick="closeSheet()">×</button><h2>Settings</h2><button class="field" onclick="toggleTheme()">Appearance</button><button class="field" onclick="toast(\'Privacy controls are local in this build\')">Privacy</button><button class="field" onclick="toast(\'Notifications enabled\')">Notifications</button><button class="field" onclick="resetApp()">Reset app data</button><p class="muted">suleimanzlatyn v2 · private build</p>')}
function toggleTheme(){document.body.style.background=document.body.style.background==='white'?'#000':'white';document.body.style.color=document.body.style.color==='black'?'#f5f5f5':'#111'}
function resetApp(){if(confirm('Reset all local app data?')){localStorage.removeItem(KEY);location.reload()}}
modal.addEventListener('click',e=>{if(e.target===modal)closeSheet()});
home();
</script>
</body></html>
