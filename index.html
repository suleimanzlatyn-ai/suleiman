<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>suleimanzlatyn</title><style>body{margin:0;background:#000;color:#fff;font:16px system-ui}nav{position:fixed;bottom:0;left:0;right:0;background:#090909;padding:14px;display:flex;justify-content:space-around}main{max-width:650px;margin:auto;padding:25px 15px 90px}.logo{font-size:25px;font-weight:800;margin-bottom:25px}.story{display:inline-grid;text-align:center;margin:8px}.avatar{width:55px;height:55px;border-radius:50%;background:linear-gradient(45deg,#ff0,#f06,#70f);padding:2px}.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #000}.post{border-bottom:1px solid #292929;padding:22px 0}.post img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.actions button{background:none;border:0;color:#fff;font-size:24px;margin:8px}.modal{display:none;position:fixed;inset:0;background:#000d;place-items:center}.modal.open{display:grid}.box{background:#171717;padding:20px;border-radius:15px;width:min(450px,90%)}input,textarea{width:100%;padding:12px;margin:7px 0;background:#080808;color:#fff;border:1px solid #444;border-radius:8px;box-sizing:border-box}button.primary{background:#fff;color:#000;border:0;border-radius:8px;padding:11px 18px;font-weight:bold}</style></head><body><main><div class="logo">suleimanzlatyn</div><section id="stories"></section><div id="feed"></div></main><nav><button onclick="home()">⌂</button><button onclick="explore()">⌕</button><button onclick="create()">＋</button><button onclick="profile()">◎</button></nav><div class="modal" id="modal"><div class="box" id="box"></div></div><script>
const photos=['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300','https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300','https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300'];let data=JSON.parse(localStorage.slPosts||'null')||[{u:'suleimanzlatyn',i:'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=900',c:'Welcome to suleimanzlatyn.',l:128},{u:'creatorhub',i:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=900',c:'Create. Share. Connect.',l:94}];function persist(){localStorage.slPosts=JSON.stringify(data)}function home(){stories.innerHTML=['Your story','amina','mohamed'].map((x,i)=>'<span class="story"><div class="avatar">'+(i?'':'＋')+'</div>'+x+'</span>').join('');feed.innerHTML=data.map((p,i)=>'<article class="post"><b>'+p.u+'</b><img src="'+p.i+'"><div class="actions"><button onclick="like('+i+')">♡</button><button>◯</button><button>⌁</button></div><b>'+p.l+' likes</b><p><b>'+p.u+'</b> '+p.c+'</p></article>').join('')}function like(i){data[i].l++;persist();home()}function create(){modal.classList.add('open');box.innerHTML='<h2>Create post</h2><input id="img" placeholder="Image URL"><textarea id="cap" placeholder="Caption"></textarea><button class="primary" onclick="publish()">Publish</button>'}function publish(){data.unshift({u:'suleimanzlatyn',i:img.value||photos[0],c:cap.value||'New post.',l:0});persist();modal.classList.remove('open');home()}function explore(){feed.innerHTML='<h2>Explore</h2><input placeholder="Search..." oninput="filter(this.value)"><div id="grid">'+data.map(p=>'<img style="width:33%;aspect-ratio:1;object-fit:cover" src="'+p.i+'">').join('')+'</div>'}function filter(q){}function profile(){feed.innerHTML='<h2>suleimanzlatyn</h2><p>Creator · Kenya</p><p>1.2K followers · '+data.filter(x=>x.u==='suleimanzlatyn').length+' posts</p>'}home();</script></body></html>
